<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="40%" stop-color="#0f1426" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Discord Blurple Gradient -->
    <linearGradient id="blurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#3b47c6" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c2e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111422" stop-opacity="0.98" />
    </linearGradient>

    <!-- Glowing Circles Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252c48" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="180" r="180" fill="#5865F2" opacity="0.18" filter="url(#glow)" />
  <circle cx="980" cy="240" r="220" fill="#00f5d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="700" cy="550" r="190" fill="#7928ca" opacity="0.15" filter="url(#glow)" />

  <!-- Abstract Circuit / Tech Wave Lines -->
  <g opacity="0.25" stroke="#5865F2" stroke-width="1.5" fill="none">
    <path d="M-50,220 C300,120 400,320 800,200 C1000,130 1150,260 1250,220" />
    <path d="M-50,340 C350,260 500,450 900,320 C1050,280 1180,380 1250,350" />
    <path d="M100,680 C320,480 600,520 850,420 C1050,340 1120,480 1250,440" stroke="#00f5d4" />
  </g>

  <!-- LEFT: Discord Chat Simulation Card -->
  <g transform="translate(80, 85)">
    <!-- Outer Glass Window -->
    <rect width="600" height="505" rx="20" fill="url(#cardGrad)" stroke="#2f375a" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="600" height="60" rx="20" fill="#131625" />
    <rect y="40" width="600" height="20" fill="#131625" />
    
    <!-- Window Dots -->
    <circle cx="30" cy="30" r="6" fill="#ed4245" />
    <circle cx="50" cy="30" r="6" fill="#faa61a" />
    <circle cx="70" cy="30" r="6" fill="#57f287" />
    
    <!-- Channel Name -->
    <g transform="translate(100, 22)">
      <text x="0" y="15" fill="#8e9297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17">#</text>
      <text x="18" y="15" fill="#f2f3f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15">comandos-bot</text>
      <text x="135" y="15" fill="#72767d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">| Automação &amp; Moderação</text>
    </g>

    <!-- Message 1: User Command -->
    <g transform="translate(30, 85)">
      <!-- User Avatar -->
      <circle cx="22" cy="22" r="20" fill="#2c2f33" />
      <circle cx="22" cy="18" r="8" fill="#5865F2" />
      <path d="M 12 34 C 12 28 32 28 32 34" fill="#5865F2" />
      
      <!-- User Header -->
      <text x="56" y="16" fill="#00f5d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15">Douglas Phaney</text>
      <text x="185" y="16" fill="#72767d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Hoje às 14:32</text>
      
      <!-- Command text -->
      <rect x="56" y="26" width="165" height="26" rx="6" fill="#202438" />
      <text x="66" y="43" fill="#5865F2" font-family="Consolas, monospace" font-weight="700" font-size="13">/painel-servidor</text>
    </g>

    <!-- Message 2: Bot Reply with Rich Embed -->
    <g transform="translate(30, 160)">
      <!-- Bot Avatar -->
      <rect x="2" y="2" width="40" height="40" rx="14" fill="url(#blurpleGrad)" />
      <!-- Bot Robot Icon -->
      <g transform="translate(10, 10)">
        <rect x="4" y="5" width="16" height="13" rx="4" fill="#ffffff" />
        <circle cx="8" cy="11" r="2" fill="#5865F2" />
        <circle cx="16" cy="11" r="2" fill="#5865F2" />
        <path d="M 10 15 L 14 15" stroke="#5865F2" stroke-width="1.5" stroke-linecap="round" />
        <line x1="12" y1="2" x2="12" y2="5" stroke="#ffffff" stroke-width="2" />
      </g>
      <!-- Online Badge on Avatar -->
      <circle cx="40" cy="40" r="5" fill="#57f287" stroke="#181c2e" stroke-width="2" />

      <!-- Bot Name & Tag -->
      <text x="56" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15">DG Assistant</text>
      <rect x="160" y="4" width="42" height="16" rx="4" fill="#5865F2" />
      <text x="167" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10">BOT ✓</text>
      <text x="212" y="16" fill="#72767d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Hoje às 14:32</text>

      <!-- Rich Embed Container -->
      <g transform="translate(56, 30)">
        <rect width="484" height="230" rx="10" fill="#20243a" stroke="#2c3452" stroke-width="1" />
        <!-- Left Color Pill (Discord Embed border) -->
        <path d="M 0 10 C 0 4 4 0 10 0 L 10 230 L 10 230 C 4 230 0 226 0 220 Z" fill="#5865F2" />

        <text x="24" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16">🛡️ Sistema de Gestão &amp; Automação Conectado</text>
        <text x="24" y="54" fill="#b9bbbe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Bot assíncrono operacional com suporte a eventos em tempo real e Webhooks.</text>

        <!-- Stats Boxes inside Embed -->
        <g transform="translate(24, 72)">
          <!-- Box 1 -->
          <rect width="135" height="58" rx="8" fill="#171a2b" stroke="#2c3350" stroke-width="1" />
          <text x="14" y="24" fill="#8e9297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">LATÊNCIA API</text>
          <text x="14" y="46" fill="#57f287" font-family="Consolas, monospace" font-weight="700" font-size="16">⚡ 18 ms</text>

          <!-- Box 2 -->
          <rect x="150" width="135" height="58" rx="8" fill="#171a2b" stroke="#2c3350" stroke-width="1" />
          <text x="164" y="24" fill="#8e9297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">COMANDOS SLASH</text>
          <text x="164" y="46" fill="#00f5d4" font-family="Consolas, monospace" font-weight="700" font-size="16">✓ 42 ativos</text>

          <!-- Box 3 -->
          <rect x="300" width="135" height="58" rx="8" fill="#171a2b" stroke="#2c3350" stroke-width="1" />
          <text x="314" y="24" fill="#8e9297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PROTEÇÃO SPAM</text>
          <text x="314" y="46" fill="#5865F2" font-family="Consolas, monospace" font-weight="700" font-size="16">Ativa 100%</text>
        </g>

        <!-- Interactive Buttons (Discord Action Row) -->
        <g transform="translate(24, 155)">
          <rect width="135" height="34" rx="6" fill="#5865F2" />
          <text x="30" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">📊 Métricas</text>

          <rect x="148" width="135" height="34" rx="6" fill="#4e5058" />
          <text x="175" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">🛡️ Moderação</text>

          <rect x="296" width="138" height="34" rx="6" fill="#248046" />
          <text x="325" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">🔔 Notificações</text>
        </g>

        <!-- Footer -->
        <text x="24" y="215" fill="#72767d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Desenvolvido por Douglas Phaney • Python &amp; Node.js</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: High-tech Showcase & Tech Stack Badges -->
  <g transform="translate(730, 85)">
    <!-- Main Showcase Card -->
    <rect width="390" height="505" rx="20" fill="url(#cardGrad)" stroke="#2f375a" stroke-width="1.5" />

    <!-- Discord Big Glowing Logo & Robot Shield -->
    <g transform="translate(195, 140)">
      <circle cx="0" cy="0" r="85" fill="#5865F2" opacity="0.15" filter="url(#glow)" />
      <circle cx="0" cy="0" r="75" fill="#141829" stroke="#5865F2" stroke-width="2" />
      
      <!-- Big Discord Clyde Logo -->
      <path d="M35,-25 C25,-32 10,-35 0,-35 C-10,-35 -25,-32 -35,-25 C-36,-13 -33,18 -18,33 C-10,38 3,38 10,38 L14,31 C6,28 1,25 -5,22 C-3,22 -2,22 0,22 C2,22 3,22 5,22 C11,25 16,28 24,31 L28,38 C35,38 48,38 56,33 C71,18 74,-13 73,-25 Z" 
            fill="#5865F2" transform="translate(-19, -5) scale(0.9)" />
      <!-- Eyes -->
      <circle cx="-16" cy="-2" r="7" fill="#ffffff" />
      <circle cx="16" cy="-2" r="7" fill="#ffffff" />
    </g>

    <!-- Title & Badges -->
    <g transform="translate(30, 260)">
      <text x="165" y="0" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24">DISCORD BOTS</text>
      <text x="165" y="24" text-anchor="middle" fill="#00f5d4" font-family="Consolas, monospace" font-weight="600" font-size="13">&lt;Automação Inteligente /&gt;</text>

      <!-- Feature Pill List -->
      <g transform="translate(15, 50)">
        <!-- Pill 1 -->
        <rect width="300" height="42" rx="10" fill="#171b2d" stroke="#2a3250" stroke-width="1" />
        <circle cx="25" cy="21" r="6" fill="#5865F2" />
        <text x="45" y="26" fill="#e0e3eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">discord.py &amp; Discord.js v14</text>

        <!-- Pill 2 -->
        <g transform="translate(0, 52)">
          <rect width="300" height="42" rx="10" fill="#171b2d" stroke="#2a3250" stroke-width="1" />
          <circle cx="25" cy="21" r="6" fill="#57f287" />
          <text x="45" y="26" fill="#e0e3eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Comandos Slash &amp; Modais Interativos</text>
        </g>

        <!-- Pill 3 -->
        <g transform="translate(0, 104)">
          <rect width="300" height="42" rx="10" fill="#171b2d" stroke="#2a3250" stroke-width="1" />
          <circle cx="25" cy="21" r="6" fill="#00f5d4" />
          <text x="45" y="26" fill="#e0e3eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Integração com APIs &amp; Webhooks</text>
        </g>

        <!-- Pill 4 -->
        <g transform="translate(0, 156)">
          <rect width="300" height="42" rx="10" fill="#171b2d" stroke="#2a3250" stroke-width="1" />
          <circle cx="25" cy="21" r="6" fill="#eb459e" />
          <text x="45" y="26" fill="#e0e3eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Banco de Dados &amp; Logs em Tempo Real</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Top Accent Banner Ribbon -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#blurpleGrad)" />
</svg>
